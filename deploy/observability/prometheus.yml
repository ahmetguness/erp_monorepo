global:
  scrape_interval: 15s
  scrape_timeout: 8s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.json]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: axon-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/axon/metrics-token
    file_sd_configs:
      - files: [/run/axon/api-targets.json]
        refresh_interval: 30s
    sample_limit: 40000
    label_limit: 12
    body_size_limit: 8MB
  - job_name: axon-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/axon/metrics-token
    file_sd_configs:
      - files: [/run/axon/worker-targets.json]
        refresh_interval: 30s
    sample_limit: 40000
    label_limit: 12
    body_size_limit: 8MB
  - job_name: axon-dr
    file_sd_configs:
      - files: [/run/axon/dr-targets.json]
        refresh_interval: 30s
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: alertmanager
    static_configs: [{targets: ['alertmanager:9093']}]
